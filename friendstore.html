<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium App Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ব্যাকগ্রাউন্ড এবং সেন্টারিং */
        body {
            background-color: #a8ff78;
            background: linear-gradient(to right, #a8ff78, #78ffd6);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* মূল মোবাইল কনটেইনার */
        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #03082b;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* হেডার সেকশন */
        header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 2px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* গোল বক্সে লোগো */
        .logo-box {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid #0a113a;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text {
            font-weight: 800;
            color: #0a113a;
            font-size: 16px;
            line-height: 1;
        }

        .logo-text span {
            display: block;
            font-size: 9px;
            font-weight: 600;
            color: #666;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* সার্চ বক্স */
        .search-box {
            display: flex;
            align-items: center;
            background-color: #f2f2f2;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .search-box input {
            border: none;
            padding: 8px 15px;
            outline: none;
            background: transparent;
            width: 110px;
            font-size: 13px;
        }

        .search-box button {
            background-color: #0a113a;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        /* অ্যাপ গ্রিড */
        main {
            flex-grow: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* প্রতিটি অ্যাপের কার্ড */
        .app-card {
            background-color: #171d4f;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #232b69;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 15px;
            object-fit: cover;
            background-color: white;
        }

        .app-title {
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .app-price {
            background-color: rgba(0, 0, 0, 0.4);
            color: #ffea00;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        /* বাটন ডিজাইন */
        .btn-details {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 8px;
            width: 100%;
            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-details:hover {
            background: rgba(255,255,255,0.1);
        }

        .btn-buy {
            background-color: #26de61;
            color: #ffffff;
            border: none;
            padding: 8px;
            width: 100%;
            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-buy:hover {
            background-color: #21c455;
        }

        /* ফুটার */
        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }

        /* মডাল (বিস্তারিত পপ-আপ) ডিজাইন */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #171d4f;
            color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            border: 2px solid #232b69;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff5252;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #78ffd6;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .modal-content ul {
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.8;
            color: #d1d8ff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- হেডার -->
        <header>
            <div class="logo">
                <div class="logo-box">
                    <!-- ডিফল্ট স্টোর লোগো -->
                    <img src="https://cdn-icons-png.flaticon.com/512/3003/3003986.png" alt="Store Logo">
                </div>
                <div class="logo-text">
                    PREMIUM
                    <span>APP STORE</span>
                </div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="সার্চ করুন...">
                <button>&#128269;</button>
            </div>
        </header>

        <!-- অ্যাপ লিস্ট -->
        <main>
            <!-- MOVIEBOX -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/RT60b08m/unnamed-1.webp" alt="MovieBox" class="app-icon">
                <div class="app-title">Moviebox Premium</div>
                <div class="app-price">মাত্র ২৫০ টাকা</div>
                <button class="btn-details" onclick="showDetails('Moviebox Premium', ['যেকোনো মুভি ফ্রিতে দেখুন', 'বিজ্ঞাপন মুক্ত অভিজ্ঞতা (No Ads)', 'হাই কোয়ালিটি ৪কে ভিডিও রেজুলেশন', 'আনলিমিটেড অফলাইন ডাউনলোড'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('Moviebox Premium')">কিনুন</button>
            </div>

            <!-- TRUE CALLER -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/DHZd0MFc/unnamed.png" alt="True Caller" class="app-icon">
                <div class="app-title">True Caller Gold</div>
                <div class="app-price">মাত্র ২৫০ টাকা</div>
                <button class="btn-details" onclick="showDetails('True Caller Gold', ['প্রিমিয়াম গোল্ড কলার আইডি', 'কোনো বিরক্তিকর বিজ্ঞাপন নেই', 'অটোমেটিক কল রেকর্ডিং ফিচার', 'প্রোফাইল কে কে দেখেছে তা জানার সুবিধা'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('True Caller Gold')">কিনুন</button>
            </div>

            <!-- PICSART -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/VYYCF28j/unnamed-1.png" alt="Picsart" class="app-icon">
                <div class="app-title">Picsart Gold</div>
                <div class="app-price">মাত্র ২৫০ টাকা</div>
                <button class="btn-details" onclick="showDetails('Picsart Gold', ['সব প্রিমিয়াম টুলস এবং ফিল্টার আনলকড', 'ওয়াটারমার্ক রিমুভ করা হয়েছে', 'অ্যাড-ফ্রি স্মুথ এক্সপেরিয়েন্স', 'হাজার হাজার প্রিমিয়াম টেমপ্লেট ও স্টিকার'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('Picsart Gold')">কিনুন</button>
            </div>

            <!-- YOUTUBE PREMIUM (Replaced Netflix) -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/k2vFd6MK/images-3-24.jpg" alt="YouTube" class="app-icon">
                <div class="app-title">YouTube Premium</div>
                <div class="app-price">মাত্র ১০০ টাকা</div>
                <button class="btn-details" onclick="showDetails('YouTube Premium', ['সম্পূর্ণ বিজ্ঞাপন-মুক্ত ভিডিও', 'স্ক্রিন অফ করে ব্যাকগ্রাউন্ড প্লে সাপোর্ট', 'ইউটিউব মিউজিক প্রিমিয়াম একদম ফ্রি', 'স্মার্ট ডাউনলোড ফিচার'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('YouTube premium')">কিনুন</button>
            </div>

            <!-- SNAPTUBE -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/39dGSr3H/Snap-Tube-Icon-Resized-Original-APK.png" alt="Snaptube" class="app-icon">
                <div class="app-title">Snaptube Premium</div>
                <div class="app-price">মাত্র ১০০ টাকা</div>
                <button class="btn-details" onclick="showDetails('Snaptube Premium', ['কোনো প্রকার বিজ্ঞাপন নেই', '4K এবং 8K রেজুলেশনে ভিডিও ডাউনলোড', 'একসাথে একাধিক ফাইল ব্যাচ ডাউনলোড', 'VIP ফিচার পুরোপুরি আনলকড'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('Snaptube Premium')">কিনুন</button>
            </div>

            <!-- HOME WORK -->
            <div class="app-card">
                <img src="https://i.ibb.co.com/PZNpGktq/unnamed-2.png" alt="Home Work" class="app-icon">
                <div class="app-title">Home Work Premium</div>
                <div class="app-price">মাত্র ১০০ টাকা</div>
                <button class="btn-details" onclick="showDetails('Home Work Premium', ['সব বিষয়ের আনলকড সলিউশন', 'কোনো বিজ্ঞাপন বা লিমিটেশন নেই', 'স্টেপ-বাই-স্টেপ ম্যাথ সলভার', 'আনলিমিটেড এআই (AI) এসিস্ট্যান্ট সাপোর্ট'])">বিস্তারিত</button>
                <button class="btn-buy" onclick="buyApp('Home Work Premium')">কিনুন</button>
            </div>
        </main>

        <!-- ফুটার -->
        <footer>
            &copy; 2026 Copyright Protected <strong>Sobuj Mia Shuvo</strong>
        </footer>

        <!-- মডাল (বিস্তারিত দেখার জন্য) -->
        <div class="modal-overlay" id="detailsModal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3 id="modalTitle">App Name</h3>
                <ul id="modalFeatures">
                    <!-- ফিচারগুলো জাভাস্ক্রিপ্ট দিয়ে এখানে আসবে -->
                </ul>
            </div>
        </div>
    </div>

    <!-- জাভাস্ক্রিপ্ট (ফিচার দেখানো এবং হোয়াটসঅ্যাপে রিডাইরেক্ট করার জন্য) -->
    <script>
        // বিস্তারিত মডাল ওপেন করা
        function showDetails(appName, featuresList) {
            document.getElementById('modalTitle').innerText = appName + " এর ফিচারসমূহ";
            
            let ul = document.getElementById('modalFeatures');
            ul.innerHTML = ''; // আগের লিস্ট ক্লিয়ার করা
            
            featuresList.forEach(function(feature) {
                let li = document.createElement('li');
                li.innerText = feature;
                ul.appendChild(li);
            });
            
            document.getElementById('detailsModal').style.display = 'flex';
        }

        // মডাল ক্লোজ করা
        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        // সরাসরি হোয়াটসঅ্যাপে রিডাইরেক্ট করা
        function buyApp(appName) {
            let phoneNumber = "8801759623887"; // আপনার নাম্বার
            let message = "আসসালামু আলাইকুম, ভাইজান আমি " + appName + " এপটি কিনতে চাই";
            let encodedMessage = encodeURIComponent(message);
            
            let whatsappUrl = "https://wa.me/" + phoneNumber + "?text=" + encodedMessage;
            window.open(whatsappUrl, '_blank'); // নতুন ট্যাবে হোয়াটসঅ্যাপ ওপেন হবে
        }
    </script>

</body>
</html>
